<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Регистрация — Магазин одежды</title>
    
</head>
<body>
    <div>
        <h1>Регистрация</h1>
        <h2>Создайте аккаунт</h2>
        <h3>И получите скидку 10% на первый заказ</h3>

            <label for="reg-name">Ваше имя:</label>
            <input 
                type="text" 
                id="reg-name" 
                name="name" 
                placeholder="Например, Сан Саныч"
                required
            >

            <label for="reg-email">Электронная почта:</label>
            <input 
                type="email" 
                id="reg-email" 
                name="email" 
                placeholder="example@mail.com"
                required
            >

            <label for="reg-password">Пароль:</label>
            <input 
                type="password" 
                id="reg-password" 
                name="password" 
                placeholder="Придумайте пароль"
                required
            >

            <label for="reg-confirm">Повторите пароль:</label>
            <input 
                type="password" 
                id="reg-confirm" 
                name="confirm" 
                placeholder="Повторите пароль"
                required
            >

            <button type="submit">Зарегистрироваться</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            Уже есть аккаунт? <a href="index.html">Вернуться на главную</a>
        </p>
    </div>
</body>
</html>
